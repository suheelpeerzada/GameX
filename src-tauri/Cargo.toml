[package]
name = "gamex"
version = "0.1.0"
description = "Import offline games and edit their content in one universal editor"
edition = "2021"

[lib]
name = "gamex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
imagesize = "0.13"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
